# Configuration for multi-modal hand gesture classification
# This config allows flexible experiments with RGB, depth, and fusion approaches

[dataset]
# Paths to parquet metadata files
# train_parquet = "/home/daryumin/Corpora/HaGRIDv2-annotations/train.parquet"
# val_parquet = "/home/daryumin/Corpora/HaGRIDv2-annotations/val.parquet"
# test_parquet = "/home/daryumin/Corpora/HaGRIDv2-annotations/test.parquet"
# data_root = "/home/daryumin/Corpora/HaGRIDv2-proc/images"
train_parquet = "/home/serg_fedchn/Homework/thesis/data/processed_hands/parquet/train.parquet"
val_parquet = "/home/serg_fedchn/Homework/thesis/data/processed_hands/parquet/val.parquet"
test_parquet = "/home/serg_fedchn/Homework/thesis/data/processed_hands/parquet/test.parquet"
data_root = "/home/serg_fedchn/Homework/thesis/data/processed_hands/images"

# Data sampling for faster experiments
train_subsample = 0.1
val_subsample = 1
test_subsample = 1

# Number of workers for data loading
num_workers = 16

[logging]
output_dir = "./outputs"
experiment_name = "resnet18_rgb_33classes"
log_interval = 100
save_interval = 1
save_best = true
checkpoints_keep = 3

[model]
# Input modality: "rgb", "depth", or "fusion"
modality = "rgb"

# Architecture: "vssd", "resnet18", "resnet50", "vit"
architecture = "resnet18"
freeze_backbone = false

# VSSD variant: "micro", "tiny", "small", "base" (only used if architecture="vssd")
vssd_variant = "micro"

# For fusion mode: how to combine RGB and depth features
# Options: 
#   Feature-level fusion: "concat", "addition", "weighted_sum", "gated_fusion", "adaptive_fusion", "cross_attention"
#   Probability-level fusion: "probability_fusion"
fusion_method = "probability_fusion"

# Number of attention heads for probability_fusion (only used if fusion_method="probability_fusion")
# Default: 1 (single-head, simplest and often most effective)
# Higher values: multiple fusion strategies learned simultaneously
probability_fusion_heads = 1

# Image dimensions
image_size = 128

# Number of gesture classes
# NOTE: Use 33 for training (thumb_index2 merged into thumb_index)
num_classes = 33

# Whether to use pretrained ImageNet weights
pretrained = true
pretrained_ckpt = ""

# Dropout rate for regularization
dropout = 0.3

# VSSD integration (only used if architecture="vssd")
vssd_repo_path = "/home/serg_fedchn/Homework/thesis/VSSD"
# vssd_repo_path = "/home/daryumin/HandGestures_experiments/VSSD"

[training]
# Training hyperparameters
batch_size = 256
num_epochs = 1
learning_rate = 3e-5
weight_decay = 5e-4

seed = 42

# Optimizer: "adam", "adamw", "sgd"
optimizer = "adamw"

# Learning rate scheduler: "cosine", "linear", "exponential", "step"
scheduler = "cosine"
warmup_epochs = 2

# Loss function
loss = "cross_entropy"

# Mixed precision training
mixed_precision = true

# Gradient accumulation steps (for effective larger batch sizes)
gradient_accumulation_steps = 1
gradient_clip_norm = 5.0

[training.early_stopping]
enabled = true
patience = 5
min_delta = 0.001
mode = "max"
monitor = "f1"

[evaluation]
val_metrics_subset_size = 0  # 0 = use full validation set to calculate metrics
metrics_compute_interval = 3
metrics = ["accuracy", "f1"]
f1_average = "weighted"

[augmentation]
# Data augmentation settings
enable_augmentation = true
random_flip = false
random_rotation = false
rotation_degrees = 0
color_jitter = true
color_jitter_brightness = 0.3   # Increased from 0.2
color_jitter_contrast = 0.3     # Increased from 0.2
color_jitter_saturation = 0.3   # Increased from 0.2
color_jitter_hue = 0.15         # Increased from 0.1
random_erasing = true           # ENABLED (was false)
erasing_probability = 0.3       # Increased from 0.1

# Mixup augmentation (applied in training loop)
use_mixup = true                # Enable Mixup
mixup_alpha = 0.2               # Mixup interpolation strength

label_smoothing = 0.1           # Prevents overconfident predictions

[hardware]
device = "cuda"
use_amp = true
pin_memory = false
